[build-system]
requires = ["setuptools>=69", "wheel", "numpy", "VBMicrolensing>=5.5"]
build-backend = "setuptools.build_meta"

[project]
name = "jacscanomaly"
version = "0.5.3"
description = "JAX-based scan anomaly detection for time-series residuals"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Kansuke Nunota" }]
dependencies = [
  "numpy",
  "jax",
  "scipy",
  "VBMicrolensing>=5.5",
  "matplotlib",
]

[project.optional-dependencies]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
  "myst-parser>=2",
]
test = [
  "pytest>=7",
  "coverage[toml]>=7",
]
vbm = []
dev = [
  "jacscanomaly[docs,test,vbm]",
]

[project.urls]
Homepage = "https://github.com/NunotaKansuke/jacscanomaly"
Repository = "https://github.com/NunotaKansuke/jacscanomaly"
Issues = "https://github.com/NunotaKansuke/jacscanomaly/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
  "jacscanomaly.test_tool*",
  "jacscanomaly.planet_class*",
  "jacscanomaly.*.__pycache__*",
]

[tool.setuptools.package-data]
jacscanomaly = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["jacscanomaly"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
